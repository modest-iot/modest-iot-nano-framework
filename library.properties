name=Modest-IoT-Nano-Framework
version=1.0.0
author=Angel Velasquez
maintainer=Angel Velasquez <avelasquezn@gmail.com>
sentence=An event-driven, asynchronous IoT framework for ESP32, designed to build complex and responsive applications without the limitations of traditional procedural loops.
paragraph=Built on a robust object-oriented architecture, Modest IoT enforces Inversion of Control (IoC) and strict communication layer separation. It leverages thread-safe background task messaging queues driven natively by hardware timers, enabling you to build sophisticated, modular, and highly responsive IoT devices while focusing on application logic.
category=Device Control
architectures=esp32
includes=ModestIoT.h
depends=ArduinoJson (>=7.0.0), MQTT (>=2.5.3)
url=https://github.com/modest-iot/modest-iot-nano-framework
