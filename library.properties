name=Modest-IoT-Nano-Framework
version=1.0.0
author=Angel Velasquez
maintainer=Angel Velasquez <avelasquezn@gmail.com>
sentence=An event-driven, asynchronous IoT framework for ESP32, designed to build complex and responsive applications without the limitations of traditional procedural loops.
paragraph=Built on a robust object-oriented architecture, ModestIoT enforces Inversion of Control (IoC) and strict communication layer separation. It leverages thread-safe background task messaging queues driven natively by hardware timers, enabling you to build sophisticated, modular, and highly responsive IoT devices while focusing on application logic.
category=Device Control
architectures=esp32
includes=ModestIoT.h
depends=ArduinoJson (>=7.0.0), PubSubClient, ESP32Servo, LiquidCrystal_I2C, DHT sensor library, Adafruit Unified Sensor
url=https://github.com/avelasquezn/Modest-IoT-Nano-Framework
